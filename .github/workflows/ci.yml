name: JobScope CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:

jobs:
  api:
    name: API (ruff + pytest + golden)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests scripts
      - name: Pytest (unit + integration + golden G1-G7)
        run: pytest -q
        env:
          JOBSCOPE_DEMO_MODE: "false"

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: Web E2E (playwright smoke)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Build (already validated, needed for start server)
        run: npm run build
      - name: Playwright tests
        run: npx playwright test

  security:
    name: Secret/PII scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for secrets and PII
        run: python scripts/security_scan.py

  snapshot-freshness:
    name: Snapshot sync check (web copy == public source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare committed copies
        shell: bash
        run: |
          diff -q data/public/market_snapshot.json apps/web/src/data/market_snapshot.json
