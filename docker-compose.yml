services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobscope
      POSTGRES_PASSWORD: jobscope
      POSTGRES_DB: jobscope
    ports:
      - "5432:5432"
    volumes:
      - jobscope_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscope -d jobscope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobscope_pg:
